<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %} MyCafe {% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav id="nav">
        <a href="{{ url_for('home') }}" class="nav-logo">Café <span>Aroma</span></a>

        <ul class="nav-links">
            <li> <a href="#about">Our Story</a> </li>
            <li> <a href="#menu">Menu</a> </li>
            <li> <a href="#values">Ingredients</a> </li>
            <li> <a href="#visit">Visit</a> </li>
        </ul>
        <a href="tel:6983590492" class="nav-phone">6983590492</a>
    </nav>

        {% block content %}

        {% endblock %}

    <footer>
        <div class="footer-bottom">
            <span>© {now.year} Café Aroma · Norwalk, CT </span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
